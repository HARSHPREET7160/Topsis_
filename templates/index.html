<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOPSIS Web Service</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
      --line: #d1d5db;
      --accent: #d97706;
      --ok: #166534;
      --ok-bg: #dcfce7;
      --err: #991b1b;
      --err-bg: #fee2e2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #eef2ff 0%, var(--bg) 60%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      overflow: hidden;
    }

    .head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: #fafafa;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
    }

    p {
      margin: 6px 0 0;
      color: #4b5563;
    }

    form {
      padding: 20px 22px 24px;
      display: grid;
      gap: 12px;
    }

    .row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 10px;
      align-items: center;
    }

    label {
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }

    input[type="file"] {
      padding: 8px;
    }

    .submit {
      margin-top: 4px;
      justify-self: start;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 9px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .msg {
      margin: 0 22px 18px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid transparent;
    }

    .ok {
      color: var(--ok);
      background: var(--ok-bg);
      border-color: #86efac;
    }

    .err {
      color: var(--err);
      background: var(--err-bg);
      border-color: #fca5a5;
    }

    @media (max-width: 640px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section class="panel">
    <div class="head">
      <h1>TOPSIS Web Service</h1>
      <p>Upload CSV, provide weights and impacts, and receive result via email.</p>
    </div>

    <form method="post" enctype="multipart/form-data">
      <div class="row">
        <label for="input_file">File Name</label>
        <input id="input_file" name="input_file" type="file" accept=".csv" required>
      </div>

      <div class="row">
        <label for="weights">Weights</label>
        <input id="weights" name="weights" type="text" placeholder="1,1,1,1" required>
      </div>

      <div class="row">
        <label for="impacts">Impacts</label>
        <input id="impacts" name="impacts" type="text" placeholder="+,+,-,+" required>
      </div>

      <div class="row">
        <label for="email">Email Id</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" required>
      </div>

      <button class="submit" type="submit">Submit</button>
    </form>

    {% if message %}
      <div class="msg {{ 'ok' if status == 'success' else 'err' }}">{{ message }}</div>
    {% endif %}
    {% if hint %}
      <div class="msg err">{{ hint }}</div>
    {% endif %}
  </section>
</body>
</html>
